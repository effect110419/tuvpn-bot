# === RATE LIMITS + SECURITY HEADERS 2026-05 ===
# TuVPN rate-limit zones.
# Память: 10MB на зону = ~160000 уникальных IP.

# 1) /sub/<uuid> — Happ обновляется раз в 6ч, легитимно никому не нужно чаще.
limit_req_zone $binary_remote_addr zone=sub_zone:10m rate=10r/m;

# 2) /admin-api/auth/start — защита от засирания admin_login_attempts.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

# 3) /admin-api/* (остальное) — нормальная работа админки.
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=60r/m;

# 4) /yookassa/webhook — ЮКасса с белого IP, но всё равно лимит.
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=60r/m;

# 5) Лимит одновременных соединений с одного IP (slowloris/тонна connect).
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# Возвращать 429 (по умолчанию 503 — менее правильно).
limit_req_status 429;
limit_conn_status 429;

# Логировать на warn а не error (чтобы /var/log/nginx/error.log не засирался).
limit_req_log_level warn;
limit_conn_log_level warn;
