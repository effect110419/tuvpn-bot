# ==========================================
# sub.tuvpn.ru — выдача подписок (Flask :5000)
# ==========================================
server {
    listen 443 ssl;
    server_name sub.tuvpn.ru;

    ssl_certificate /etc/letsencrypt/live/sub.tuvpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.tuvpn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === RATE LIMITS + SECURITY HEADERS 2026-05 ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    limit_conn conn_zone 20;


    location ~ ^/sub/ {
        limit_req zone=sub_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/yookassa/webhook {
        limit_req zone=webhook_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# admin.tuvpn.ru — статика admin.html + API
# ==========================================
server {
    listen 443 ssl;
    server_name admin.tuvpn.ru;
    ssl_certificate /etc/letsencrypt/live/sub.tuvpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.tuvpn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === RATE LIMITS + SECURITY HEADERS 2026-05 ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    limit_conn conn_zone 20;


    root /var/www/html;
    index index.html;

    # Главная — отдаём index.html (новая админка)
    location = / {
        try_files /index.html =404;
    }

    # Разрешённые статические файлы новой админки
    location ~ ^/(index\.html|styles\.css|app\.js)$ {
        try_files $uri =404;
    }

    # Старая админка (на всякий — пока не удалили)
    location = /admin.html {
        try_files $uri =404;
    }

    # /admin-api/auth/* — самый жёсткий лимит (anti-spam логин-попыток)
    location ~ ^/admin-api/auth/ {
        limit_req zone=auth_zone burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin-api/* — общий лимит
    location /admin-api/ {
        limit_req zone=admin_zone burst=30 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# Редирект HTTP → HTTPS (создан certbot)
# ==========================================
server {
    listen 80;
    server_name sub.tuvpn.ru admin.tuvpn.ru;

    if ($host = sub.tuvpn.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = admin.tuvpn.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
